name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - run: python -m pip install -e ".[test]"
      - run: python -m ruff check encrypted_project_pro tests
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_QT_API: pyside6
          QT_API: pyside6
  piv-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libegl1 libgl1
      - run: python -m pip install -e ".[test,yubikey]"
      - run: python -c "import yubikit.piv; import ykman.device"
      - run: python -m pytest tests/test_hardware.py -q
