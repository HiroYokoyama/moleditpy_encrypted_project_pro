[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moleditpy-encrypted-project-pro"
version = "0.1.2"
description = "Password, key-file, public-key and YubiKey .pmeecp project encryption for MoleditPy"
requires-python = ">=3.10,<3.15"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "COPYING", "LICENSING.md"]
authors = [{name = "HiroYokoyama"}]
dependencies = ["cryptography>=46,<52"]

[project.optional-dependencies]
yubikey = ["yubikey-manager>=5.9,<6"]
test = ["pytest", "pytest-qt", "PySide6-Essentials>=6.10,<6.13", "ruff"]

[tool.setuptools.packages.find]
include = ["encrypted_project_pro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py310"
extend-exclude = ["scripts/release_common.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
